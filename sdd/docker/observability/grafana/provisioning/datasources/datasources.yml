apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # "[<traceId>,<spanId>]" in every API log line → link to the trace in Tempo.
      derivedFields:
        - name: TraceID
          matcherRegex: '\[([0-9a-f]{32}),'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: Trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: true
        query: '{service="payments-api"} |= "$${__trace.traceId}"'
      serviceMap:
        datasourceUid: prometheus
